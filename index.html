<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rider Income & Expense Tracker - Dark Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Font: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #0f172a;
            color: #f1f5f9;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }
        .active-tab {
            color: #38bdf8;
            border-bottom: 3px solid #38bdf8;
            font-weight: 600;
        }
        /* Custom App Colors & Badges */
        .app-badge-grab { background-color: #10b981; color: white; } 
        .app-badge-maxim { background-color: #eab308; color: #1e293b; font-weight: 700; } 
        .app-badge-shopee { background-color: #f97316; color: white; } 
        .app-badge-lineman { background-color: #059669; color: white; }
        .app-badge-robinhood { background-color: #9d223c; color: white; }
        .app-badge-other { background-color: #475569; color: white; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900/80 backdrop-blur-md text-white sticky top-0 z-30 border-b border-slate-800 shadow-lg">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-10 h-10 bg-sky-500/10 border border-sky-500/30 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-motorcycle text-xl text-yellow-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-slate-100">Rider Tracker Pro</h1>
                    <p class="text-[11px] text-sky-400 font-medium">Dark Mode Edition</p>
                </div>
            </div>
            <button onclick="exportCSV()" title="ส่งออก CSV" class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 rounded-xl border border-slate-700 transition flex items-center text-xs space-x-1 text-emerald-400">
                <i class="fa-solid fa-file-csv text-base"></i>
                <span class="hidden sm:inline">Export</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Period Selector & Summary Card Header -->
        <div class="bg-slate-800/90 backdrop-blur-sm rounded-2xl p-4 shadow-xl border border-slate-700/80 mb-4 space-y-3">
            <div class="flex justify-between items-center">
                <label for="filterPeriod" class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-regular fa-calendar-days text-sky-400"></i> ช่วงเวลาสรุปผล
                </label>
                <select id="filterPeriod" onchange="onPeriodChange()" class="bg-slate-900 border border-slate-700 text-sky-400 text-xs rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-sky-500 focus:outline-none font-bold">
                    <option value="day">📅 เลือกดูตามวัน</option>
                    <option value="week">📆 สัปดาห์นี้ (จันทร์ - อาทิตย์)</option>
                    <option value="month">🗓️ เดือนนี้</option>
                </select>
            </div>

            <!-- Specific Date Picker (Shown only in 'day' mode) -->
            <div id="datePickerContainer" class="flex justify-between items-center bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-700/60">
                <span class="text-xs text-slate-400">วันที่เจาะจง:</span>
                <input type="date" id="filterDate" onchange="renderDashboard()" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:ring-1 focus:ring-sky-500 focus:outline-none font-medium">
            </div>

            <!-- Main Financial Summary Cards -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-emerald-950/40 border border-emerald-800/50 rounded-xl p-3">
                    <span class="text-xs font-medium text-emerald-400 block mb-1">
                        <i class="fa-solid fa-arrow-down-left text-xs mr-1"></i> รายได้รวม
                    </span>
                    <span id="statTotalIncome" class="text-xl font-bold text-emerald-300">฿0</span>
                    <span id="statTotalTrips" class="text-[11px] text-emerald-400/80 block mt-0.5">0 วิ่ง (0 บ้าน)</span>
                </div>
                <div class="bg-rose-950/40 border border-rose-800/50 rounded-xl p-3">
                    <span class="text-xs font-medium text-rose-400 block mb-1">
                        <i class="fa-solid fa-arrow-up-right text-xs mr-1"></i> ค่าใช้จ่ายรวม
                    </span>
                    <span id="statTotalExpense" class="text-xl font-bold text-rose-300">฿0</span>
                    <span id="statExpenseBreakdown" class="text-[11px] text-rose-400/80 block mt-0.5">น้ำมัน ฿0</span>
                </div>
            </div>

            <!-- Net Profit Banner -->
            <div id="netProfitBox" class="bg-gradient-to-r from-sky-600 to-indigo-700 rounded-xl p-3.5 text-white flex justify-between items-center shadow-md">
                <div>
                    <span class="text-xs text-sky-200 block font-light">กำไรสุทธิ (Net Income)</span>
                    <span id="statNetProfit" class="text-2xl font-black tracking-tight">฿0</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-sky-200 block font-light">เฉลี่ยต่อบ้าน</span>
                    <span id="statAvgPerTrip" class="text-base font-bold text-yellow-300">฿0 / บ้าน</span>
                </div>
            </div>

            <!-- Mileage Summary Widget -->
            <div class="pt-2 border-t border-slate-700/80 flex justify-between items-center text-xs text-slate-300">
                <span class="flex items-center gap-1 text-slate-400">
                    <i class="fa-solid fa-road text-sky-400"></i> ระยะทางรวมช่วงนี้:
                </span>
                <span id="statTotalKm" class="font-bold text-sky-300 text-sm">0 กม.</span>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-800 mb-4 bg-slate-800/80 rounded-t-2xl px-2 border-x border-t border-slate-700/60">
            <button onclick="switchTab('add')" id="tab-btn-add" class="flex-1 py-3 text-center text-sm active-tab flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-circle-plus"></i>
                <span>ลงบันทึก</span>
            </button>
            <button onclick="switchTab('history')" id="tab-btn-history" class="flex-1 py-3 text-center text-sm text-slate-400 flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-list-check"></i>
                <span>รายการบันทึก</span>
            </button>
            <button onclick="switchTab('stats')" id="tab-btn-stats" class="flex-1 py-3 text-center text-sm text-slate-400 flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-chart-pie"></i>
                <span>สถิติ/ภาพรวม</span>
            </button>
        </div>

        <!-- TAB 1: ADD DATA FORM -->
        <div id="tab-add" class="space-y-4">
            <!-- Form Type Switcher -->
            <div class="grid grid-cols-2 p-1 bg-slate-800 rounded-xl text-xs font-medium border border-slate-700">
                <button onclick="toggleFormType('trip')" id="form-type-trip" class="py-2 rounded-lg bg-sky-600 text-white font-bold transition shadow">
                    <i class="fa-solid fa-motorcycle mr-1"></i> บันทึกงานรายรอบ
                </button>
                <button onclick="toggleFormType('expense')" id="form-type-expense" class="py-2 rounded-lg text-slate-400 transition">
                    <i class="fa-solid fa-gas-pump mr-1"></i> บันทึกค่าใช้จ่าย/ไมล์
                </button>
            </div>

            <!-- TRIP FORM -->
            <form id="tripForm" onsubmit="handleSaveTrip(event)" class="bg-slate-800 rounded-2xl p-4 shadow-xl border border-slate-700 space-y-3">
                <h3 class="font-bold text-slate-200 text-sm flex items-center gap-2 border-b border-slate-700 pb-2">
                    <span class="w-2 h-4 bg-sky-500 rounded-full inline-block"></span>
                    ข้อมูลรับงานรายรอบ
                </h3>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 font-medium mb-1">วันที่</label>
                        <input type="date" id="tripDate" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 font-medium mb-1">แอปพลิเคชัน</label>
                        <select id="tripApp" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none font-medium">
                            <option value="Grab">Grab</option>
                            <option value="MAXIM">MAXIM</option>
                            <option value="LINE MAN">LINE MAN</option>
                            <option value="ShopeeFood">ShopeeFood</option>
                            <option value="Robinhood">Robinhood</option>
                            <option value="Other">แอปอื่นๆ / วิน</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 font
