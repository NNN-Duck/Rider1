<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rider Income & Expense Tracker - ระบบบันทึกรายรับรายจ่ายไรเดอร์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Font: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
        .bottom-nav-active {
            color: #38bdf8;
            font-weight: 600;
        }
        .bottom-nav-active i {
            transform: translateY(-2px);
            filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.4));
        }
        /* Custom App Radio Badges */
        .app-radio:checked + label {
            border-color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }
        /* Glow Glass Effects */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#0b0f19] min-h-screen text-slate-100 pb-24 select-none">

    <!-- Top Bar -->
    <header class="bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800/80 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 bg-gradient-to-br from-sky-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-motorcycle text-lg text-white"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <h1 class="font-bold text-base leading-none text-slate-100 tracking-wide">Rider Tracker Pro</h1>
                        <span class="text-[10px] bg-sky-500/20 text-sky-300 border border-sky-500/30 font-semibold px-1.5 py-0.2 rounded-full">v2.0</span>
                    </div>
                    <p class="text-[11px] text-slate-400 font-light mt-0.5">ระบบบันทึกงานไรเดอร์มืออาชีพ</p>
                </div>
            </div>
            <div class="flex items-center space-x-1.5">
                <button onclick="exportCSV()" title="ส่งออก CSV" class="px-2.5 py-1.5 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/80 active:scale-95 rounded-xl transition flex items-center space-x-1.5 text-xs text-slate-300">
                    <i class="fa-solid fa-file-csv text-emerald-400"></i>
                    <span>ส่งออก</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 pt-3">

        <!-- Date Range Filter Card -->
        <div class="glass-card rounded-2xl p-3.5 shadow-xl mb-3 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
                <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                    <i class="fa-regular fa-calendar-check text-sky-400"></i> ช่วงเวลาสรุปผล
                </span>
                <span id="displayDateRangeText" class="text-[11px] text-sky-400 font-mono bg-sky-950/60 border border-sky-800/50 px-2 py-0.5 rounded-full">วันนี้</span>
            </div>
            
            <!-- Quick Date Filter Buttons -->
            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="setQuickDate('today')" id="btn-quick-today" class="py-1.5 px-2 bg-sky-600 text-white font-medium text-xs rounded-xl shadow-md border border-sky-400/30 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-sun text-amber-300 text-[11px]"></i>
                    <span>วันนี้</span>
                </button>
                <button onclick="setQuickDate('week')" id="btn-quick-week" class="py-1.5 px-2 bg-slate-800/80 text-slate-300 font-medium text-xs rounded-xl border border-slate-700/70 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-calendar-week text-sky-400 text-[11px]"></i>
                    <span>สัปดาห์นี้</span>
                </button>
                <button onclick="setQuickDate('month')" id="btn
